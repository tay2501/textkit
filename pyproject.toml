[build-system]
requires = ["hatchling", "hatch-polylith-bricks"]
build-backend = "hatchling.build"

[project]
name = "text-processing-toolkit"
version = "0.1.0"
description = "Polylith workspace for text processing applications with token-optimized architecture"
# readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.16.1",
    "rich>=14.1.0",
    "pyperclip>=1.9.0",
    "watchdog>=6.0.0",
    "cryptography>=45.0.6",
    "sqlalchemy>=2.0.43",
    "structlog>=25.4.0",
    "orjson>=3.10.0",
    "charset-normalizer>=3.4.0",
    "jaconv>=0.4.0",
    "aiofiles>=24.1.0",
    "stringzilla>=4.0.14",
    "lagom>=2.7.7",
]

[project.optional-dependencies]
dev = [
    "hatch-polylith-bricks>=1.5.2",
    "polylith-cli>=1.35.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "mypy>=1.17.1",
    "ruff>=0.6.0",
]
docs = [
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
    "sphinx-autobuild>=2024.12.24",
    "myst-parser>=4.0.0",
]

[tool.hatch.build]
dev-mode-dirs = ["components", "bases", "development", "."]

# Polylithビルドフック設定（必須）
[tool.hatch.build.hooks.polylith-bricks]
# この空のセクションはビルドプロセスでフックを有効化するために必要

# カスタムトップネームスペース設定
[tool.polylith.build]
top-namespace = "textkit"

# ブリック（コンポーネント・ベース）のマッピング定義
[tool.polylith.bricks]
"bases/text_processing/cli_interface" = "textkit/cli_interface"
"bases/text_processing/interactive_session" = "textkit/interactive_session"
"components/async_core" = "textkit/async_core"
"components/command_handler" = "textkit/command_handler"
"components/common_utils" = "textkit/common_utils"
"components/config_manager" = "textkit/config_manager"
"components/crypto_engine" = "textkit/crypto_engine"
"components/dependency_injection" = "textkit/dependency_injection"
"components/exceptions" = "textkit/exceptions"
"components/help_system" = "textkit/help_system"
"components/io_handler" = "textkit/io_handler"
"components/rule_parser" = "textkit/rule_parser"
"components/text_core" = "textkit/text_core"

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# MyPy configuration (complementary to mypy.ini)
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.1",
]
