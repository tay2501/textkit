[build-system]
requires = ["hatchling", "hatch-polylith-bricks"]
build-backend = "hatchling.build"

[project]
name = "text-processing-toolkit"
version = "0.1.0"
description = "Polylith workspace for text processing applications with token-optimized architecture"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "typer>=0.16.1",
    "rich>=14.1.0",
    "pyperclip>=1.9.0",
    "watchdog>=6.0.0",
    "cryptography>=45.0.6",
    "structlog>=25.4.0",
    "orjson>=3.10.0",
    "charset-normalizer>=3.4.0",
    "jaconv>=0.4.0",
    "aiofiles>=24.1.0",
    # "stringzilla>=4.0.14",  # Temporarily disabled: No prebuilt wheels for Python 3.14 RC
    "lagom>=2.7.7",
    "keyring>=25.7.0",
    "typing-extensions>=4.15.0",
    "polars>=1.35.2",
]

[project.optional-dependencies]
dev = [
    "hatch-polylith-bricks>=1.5.2",
    "polylith-cli>=1.35.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "mypy>=1.17.1",
    "ruff>=0.13.1",
]
docs = [
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
    "sphinx-autobuild>=2024.12.24",
    "myst-parser>=4.0.0",
]

[tool.hatch.build]
dev-mode-dirs = ["components", "bases", "development", "."]

# Polylithビルドフック設定（必須）
[tool.hatch.build.hooks.polylith-bricks]
# この空のセクションはビルドプロセスでフックを有効化するために必要

# カスタムトップネームスペース設定
[tool.polylith.build]
top-namespace = "textkit"

# ブリック（コンポーネント・ベース）のマッピング定義
[tool.polylith.bricks]
"bases/text_processing/cli_interface" = "textkit/cli_interface"
"bases/text_processing/interactive_session" = "textkit/interactive_session"
"components/async_core" = "textkit/async_core"
"components/command_handler" = "textkit/command_handler"
"components/common_utils" = "textkit/common_utils"
"components/config_manager" = "textkit/config_manager"
"components/crypto_engine" = "textkit/crypto_engine"
"components/dependency_injection" = "textkit/dependency_injection"
"components/exceptions" = "textkit/exceptions"
"components/help_system" = "textkit/help_system"
"components/io_handler" = "textkit/io_handler"
"components/rule_parser" = "textkit/rule_parser"
"components/text_core" = "textkit/text_core"

# Ruff configuration - Modern Python linter (2025 standards)
[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"
preview = true  # Enable Python 3.15+ features

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
# Enable recommended rule sets (2025 best practices)
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ASYNC",  # asyncio anti-patterns (2025)
    "S",      # security vulnerabilities (bandit)
    "RUF",    # Ruff-specific rules
    "PERF",   # performance optimizations
    # 2025 additional recommended rules
    "PTH",    # pathlib (prefer pathlib over os.path)
    "TD",     # TODO comment management
    "FIX",    # FIXME/XXX/HACK detection
    "ERA",    # commented-out code detection
    "TRY",    # try/except anti-patterns
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "S101",   # Use of assert (acceptable in tests)
    # TRY rules - gradual adoption recommended
    "TRY003", # Verbose exception messages (222 violations - review gradually)
    "TRY300", # try-consider-else (design decision, review case-by-case)
    "TRY301", # raise-within-try (design pattern, review case-by-case)
    "TRY400", # error-vs-exception naming (low priority)
    # ERA rules - manual review needed
    "ERA001", # Commented-out code (manual review recommended)
]

# Allow fix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py
"bin/*.py" = ["E402"]  # Module imports after sys.path modification (intentional)
"test/**/*.py" = ["E402", "S"]  # Test files: sys.path + security checks

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.format]
# Like Black, use double quotes for strings
quote-style = "double"

# Like Black, indent with spaces, rather than tabs
indent-style = "space"

# Like Black, respect magic trailing commas
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings
docstring-code-format = false

# MyPy configuration (complementary to mypy.ini)
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[dependency-groups]
dev = [
    "furo>=2025.9.25",
    "mypy>=1.18.2",
    "myst-parser>=4.0.1",
    "pytest-asyncio>=1.2.0",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.1",
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc-typehints>=3.5.2",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.0.2",
    "types-aiofiles>=25.1.0.20251011",
]

# ============================================================================
# uv Configuration (Performance Optimization - 2025)
# ============================================================================
# Reference: https://docs.astral.sh/uv/configuration/files/
[tool.uv]
# Compile Python bytecode for faster application startup (10-20% improvement)
# Implements Python 3.13 performance best practices
# TEMPORARY: Disabled due to Python 3.13.7 asyncio compatibility issue
compile-bytecode = false

# Allow pre-releases only when explicitly required by dependencies
prerelease = "if-necessary-or-explicit"

# NOTE: For Windows UTF-8 mode support (PEP 540/686), set environment variable:
# Windows PowerShell: $env:PYTHONUTF8="1"; uv run python main.py
# Windows CMD: set PYTHONUTF8=1 && uv run python main.py
# Linux/macOS: PYTHONUTF8=1 uv run python main.py
# Or create a .env file with: PYTHONUTF8=1
