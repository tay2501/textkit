# Pants Build Configuration
# Integration with Polylith Architecture - maintains existing code organization
# while providing advanced build orchestration capabilities

[GLOBAL]
pants_version = "2.29.0"
backend_packages = [
  # Core Python support
  "pants.backend.python",

  # Linting and formatting (integrate with existing Ruff setup)
  "pants.backend.python.lint.ruff",

  # Type checking (integrate with existing MyPy setup)
  "pants.backend.python.typecheck.mypy",
]

# Build isolation - Pants uses its own cache
build_ignore = [
  ".git/",
  ".venv/",
  "dist/",
  "build/",
  "__pycache__/",
  "*.egg-info/",
  ".pytest_cache/",
  ".mypy_cache/",
  ".ruff_cache/",
  "htmlcov/",
  "logs/",
  "cache/",
]

# Anonymous telemetry - can be disabled
pants_telemetry_enabled = false

# Source roots configuration
# Preserves Polylith architecture structure: components, bases, projects
[source]
root_patterns = [
  "/components",
  "/bases",
  "/projects",
  "/test",
]

# Python configuration
[python]
# Match project's Python version requirement
interpreter_constraints = [">=3.13"]

# Enable multiple resolves for better dependency management
enable_resolves = true
default_resolve = "python-default"

# Python resolves - can expand this for different projects
[python.resolves]
python-default = "3rdparty/python/default.lock"

# Ruff configuration - integrate with existing pyproject.toml settings
[ruff]
# Ruff will use settings from pyproject.toml by default
config = "pyproject.toml"

# MyPy configuration - integrate with existing mypy.ini
[mypy]
config = "mypy.ini"

# Test configuration
[test]
# Reasonable default timeouts
timeout_default = 60
timeout_maximum = 600

# Use colors in output
use_coverage = true

# Coverage.py configuration
[coverage-py]
# Match our interpreter constraints
interpreter_constraints = [">=3.13"]
# Generate reports in multiple formats
report = ["console", "html"]

# Performance optimization: concurrent execution
[rule-threads-core]
# Use available CPU cores for parallel builds
num_threads = 4

# Cache configuration for faster builds
[GLOBAL.cache]
# Enable local caching
read_from = "local"
write_to = "local"
