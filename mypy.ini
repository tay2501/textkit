[mypy]
# Polylith architecture path configuration (2026 best practice)
# Note: Using "." only to avoid module name conflicts (e.g., components.x vs x)
# Polylith maps bricks to textkit.* namespace at build time
mypy_path = .
namespace_packages = True
explicit_package_bases = True
python_version = 3.14
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_any_unimported = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
check_untyped_defs = True
strict_equality = True
warn_unreachable = True
show_error_codes = True
color_output = True
extra_checks = True

# ============================================================================
# 2025 Type Checking Best Practices
# ============================================================================
# Current configuration already follows modern standards with:
# - Full warning suite enabled (return_any, unused, redundant, unreachable)
# - Strict equality checks
# - Untyped function checking
# - Extra validations enabled
#
# Gradual strictness migration strategy (2025 best practice):
# 1. Enable strict checks globally for new modules (see below)
# 2. Exclude legacy modules with per-module overrides
# 3. Migrate modules incrementally when refactoring
#
# Current status (2025-12-19): 378 errors in 51 files (111 total files)
# Target: Reduce to <100 errors by enabling strict mode on clean modules
#
# Migration roadmap:
# Phase 1: Enable no_implicit_optional (low-hanging fruit)
# Phase 2: Enable disallow_incomplete_defs (moderate effort)
# Phase 3: Enable disallow_untyped_defs (high effort, long-term goal)

# Phase 1: Enable for better Optional[] clarity
# no_implicit_optional = True # Now enabled globally

# Gradual strictness targets (to be enabled per-module):
# disallow_incomplete_defs = True   # Require complete type annotations
# disallow_untyped_calls = True     # Disallow calling untyped functions
# disallow_any_generics = True      # Require explicit generic parameters

# Per-module strict mode example (apply to new/clean modules):
# [mypy-components.new_module.*]
# disallow_untyped_defs = True
# disallow_incomplete_defs = True

# Ignore missing imports for third-party libraries
[mypy-stringzilla]
ignore_missing_imports = True

[mypy-jaconv]
ignore_missing_imports = True

[mypy-pyperclip]
ignore_missing_imports = True

[mypy-watchdog.*]
ignore_missing_imports = True

# ============================================================================
# Legacy/Planned Module Overrides (2026-01 Refactoring)
# ============================================================================
# These modules reference planned but unimplemented sub-packages
# TODO: Remove these overrides when modules are implemented or refactored

[mypy-bases.text_processing.cli_interface.models.*]
ignore_missing_imports = True

[mypy-bases.text_processing.cli_interface.exceptions]
ignore_missing_imports = True

[mypy-bases.text_processing.cli_interface.io.*]
ignore_missing_imports = True

[mypy-bases.text_processing.cli_interface.utils.*]
ignore_missing_imports = True

[mypy-bases.text_processing.cli_interface.application_factory]
ignore_missing_imports = True

[mypy-bases.text_processing.interactive_session.types]
ignore_missing_imports = True

[mypy-components.io.*]
ignore_missing_imports = True

# Relax strict checks for legacy bases files with unresolved imports
[mypy-bases.text_processing.cli_interface.main]
disallow_any_unimported = False

[mypy-bases.text_processing.interactive_session.interactive]
disallow_any_unimported = False
