[mypy]
mypy_path = .
namespace_packages = True
explicit_package_bases = True
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True
warn_unreachable = True
check_untyped_defs = True
show_error_codes = True
color_output = True
extra_checks = True

# ============================================================================
# 2025 Type Checking Best Practices
# ============================================================================
# Current configuration already follows modern standards with:
# - Full warning suite enabled (return_any, unused, redundant, unreachable)
# - Strict equality checks
# - Untyped function checking
# - Extra validations enabled
#
# Gradual strictness migration targets (future):
# disallow_untyped_defs = True      # Require type hints on all functions
# disallow_incomplete_defs = True   # Require complete type annotations
# disallow_untyped_calls = True     # Disallow calling untyped functions
# disallow_any_generics = True      # Require explicit generic parameters
# no_implicit_optional = True       # Require explicit Optional[]
#
# Per-module override example:
# [mypy-components.new_module.*]
# disallow_untyped_defs = True

# Ignore missing imports for third-party libraries
[mypy-stringzilla]
ignore_missing_imports = True

[mypy-jaconv]
ignore_missing_imports = True

[mypy-pyperclip]
ignore_missing_imports = True

[mypy-watchdog.*]
ignore_missing_imports = True
