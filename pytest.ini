# Pytest Configuration
# Following pytest 8.4+ best practices and Python 3.13+ standards

[tool:pytest]
# Test discovery settings
testpaths = test
pythonpath = .

# Asyncio configuration for async tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Default command-line options
addopts =
    # Verbose output with detailed test information
    -v
    # Show short traceback format for better readability
    --tb=short
    # Enforce strict marker validation (all markers must be registered)
    --strict-markers
    # Enforce strict configuration validation
    --strict-config
    # Show extra test summary info for all test types except passed
    -ra
    # Show local variables in tracebacks for debugging
    --showlocals
    # Enable color output
    --color=yes
    # Parallel execution (2025 best practice)
    # -n auto: Use all available CPU cores for parallel test execution
    # --dist loadgroup: Distribute tests by group (markers) for better load balancing
    # Expected speedup: 50-70% reduction in test execution time
    -n auto
    --dist loadgroup
    # Coverage settings
    --cov=components
    --cov=bases
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    # Performance: fail fast on first N failures (CI optimization)
    --maxfail=5

# Minimum required pytest version
minversion = 8.4

# Custom markers for test categorization
# Use with: @pytest.mark.unit, @pytest.mark.slow, etc.
# Run specific markers: pytest -m unit
# Exclude markers: pytest -m "not slow"
markers =
    # Test type markers
    unit: Unit tests - test individual components in isolation
    integration: Integration tests - test component interactions
    performance: Performance tests - measure execution speed and resource usage

    # Performance markers
    slow: Tests that take longer than 1 second to execute

    # Component-specific markers
    crypto: Tests requiring cryptography functionality
    text_processing: Tests for text transformation and processing
    io: Tests for input/output operations including clipboard and file system
    config: Tests for configuration management

    # Asyncio marker (pytest-asyncio)
    asyncio: marks tests as async (pytest-asyncio)

# Filtering warnings
filterwarnings =
    # Convert warnings to errors for stricter testing
    error
    # Ignore specific deprecation warnings from third-party libraries
    ignore::DeprecationWarning:pyperclip
    ignore::DeprecationWarning:watchdog

# Console output style
console_output_style = progress

# Log format for captured logs
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test execution timeout (optional, requires pytest-timeout plugin)
# timeout = 300
# timeout_method = thread